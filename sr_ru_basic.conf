DOMAIN-SUFFIX,scdn.co,PROXY

# Cloudflare
DOMAIN-SUFFIX,cloudflare.com,PROXY
DOMAIN-SUFFIX,cloudflare-dns.com,PROXY
DOMAIN-SUFFIX,cloudfront.net,PROXY
DOMAIN-SUFFIX,workers.dev,PROXY

GEOIP,RU,DIRECT
RULE-SET,https://raw.githubusercontent.com/misha-tgshv/shadowrocket-configuration-file/refs/heads/main/rules/domains_geo_detect.list,DIRECT


FINAL,MAIN PROXY