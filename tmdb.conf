[General]
dns-server = https://cloudflare-dns.com/dns-query
fallback-dns-server = https://dns.google/dns-query
ipv6 = false
prefer-ipv6 = false
dns-direct-system = false
dns-direct-fallback-proxy = true
routing-domain-resolve = true

[Rule]

# TMDB — строго через прокси
DOMAIN-SUFFIX,themoviedb.org,PROXY
DOMAIN-SUFFIX,tmdb.org,PROXY
DOMAIN-SUFFIX,tmdb.com,PROXY

# API и картинки (важно!)
DOMAIN-SUFFIX,api.themoviedb.org,PROXY
DOMAIN-SUFFIX,image.tmdb.org,PROXY

# всё остальное — напрямую
FINAL,DIRECT