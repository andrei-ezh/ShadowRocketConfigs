# Reply to ICMP echo requests automatically.
icmp-auto-reply = false

# Apply REJECT URL rewrites outside Config routing mode.
always-reject-url-rewrite = false

# Choose the fallback action when a matched policy cannot relay UDP.
udp-policy-not-supported-behaviour = REJECT


update-url = https://raw.githubusercontent.com/andrei-ezh/ShadowRocketConfigs/refs/heads/main/sr_ru_geoip.conf


[Rule]
# Reject routes for advertising, trackers and analytics.
DOMAIN-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Advertising/Advertising_Domain.list,REJECT-DROP
RULE-SET,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Shadowrocket/Advertising/Advertising.list,REJECT-DROP

# Direct routes for certain foreign resources.
RULE-SET,https://cdn.jsdelivr.net/gh/sub-kek/shadowrocket-lists@master/shadowrocket/apple.list,DIRECT
RULE-SET,https://cdn.jsdelivr.net/gh/Repcz/Tool@X/Shadowrocket/Rules/Apple.list,DIRECT
RULE-SET,https://cdn.jsdelivr.net/gh/sub-kek/shadowrocket-lists@master/shadowrocket/reddit.list,DIRECT

# Direct routes for Russian whitelist domains.
RULE-SET,https://cdn.jsdelivr.net/gh/Master-Yoba/shadowrocket-rules@release/rules-geosite/geosite-ru-mobile-whitelist.list,DIRECT

# Direct routes for Russian inside-only domains.
RULE-SET,https://cdn.jsdelivr.net/gh/Master-Yoba/shadowrocket-rules@release/rules-geosite/geosite-ru-available-only-inside.list,DIRECT

# Proxy routes for Russian blocked resources.
RULE-SET,https://cdn.jsdelivr.net/gh/Master-Yoba/shadowrocket-rules@release/rules-geosite/geosite-ru-blocked.list,PROXY
RULE-SET,https://cdn.jsdelivr.net/gh/Master-Yoba/shadowrocket-rules@release/rules-geoip/geoip-ru-blocked.list,PROXY

# Proxy routes for foreign geoblocked resources.
RULE-SET,https://cdn.jsdelivr.net/gh/haritos90/allow-domains@main/Categories/15-ru-ip-blocked-surge.list,PROXY
RULE-SET,https://cdn.jsdelivr.net/gh/1andrevich/Re-filter-lists@main/community_ips.lst,PROXY




# --- Keenetic ---
DOMAIN-KEYWORD,challenger35.netcraze.pro,DIRECT


# Direct routes for Russian resources.
RULE-SET,https://cdn.jsdelivr.net/gh/Master-Yoba/shadowrocket-rules@release/rules-geosite/geosite-category-ru.list,DIRECT
GEOIP,RU,DIRECT


# Final route
FINAL,PROXY

[Host]
# App Store 下载请求解析 金山CDN
iosapps.itunes.apple.com = iosapps.itunes.apple.com.download.ks-cdn.com

# Local hosts
localhost = 127.0.0.1
localdns = 198.18.0.2
localtunnel = 10.7.0.1
localdrop = 0.255.255.255

# Local domains
*.lan = server:system

# Captive portals
captive.apple.com = server:system
